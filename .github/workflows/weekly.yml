name: Alerta revistas semanal

on:
  schedule:
    # Varios horarios de respaldo el lunes por la mañana. El primero que encuentre
    # novedades envía el correo; los siguientes, al no quedar nada nuevo, no envían
    # (ver lógica "Sin novedades" en R/run.R). Basta con que uno de ellos funcione.
    # Se usan minutos "raros" (no :00) porque GitHub retrasa/omite las tareas
    # programadas a las en punto cuando hay mucha carga.
    - cron: "7 7 * * 1"    # lunes 09:07 hora española (verano)
    - cron: "7 8 * * 1"    # respaldo: 10:07 hora española (verano)
    - cron: "23 9 * * 1"   # respaldo: 11:23 hora española (verano)
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      ignore_seen:
        description: "Reenviar todo lo de la ventana (ignora la memoria; útil para ver el formato). No la modifica."
        type: boolean
        default: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Instalar paquetes R
        run: |
          Rscript -e 'install.packages(c("jsonlite","yaml","glue","blastula"), repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")'

      - name: Ejecutar alerta
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          IGNORE_SEEN: ${{ inputs.ignore_seen == true && '1' || '0' }}
          # El top-80 de "Sociology and Political Science" (SJR) es casi todo
          # ciencia política y management: solo ~11 revistas sociológicas.
          # Con 150 entran Social Forces (#93), British Journal of Sociology (#106)
          # y Social Science Research (#119).
          TOP_SJR: "150"
        run: Rscript R/run.R

      - name: Guardar estado (artículos ya enviados)
        run: |
          git config user.name "alerta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git commit -m "Actualiza estado $(date -u +%F)" || echo "sin cambios"
          git push
