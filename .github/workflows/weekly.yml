name: Alerta revistas semanal

on:
  schedule:
    - cron: "7 7 * * 1"   # lunes 07:07 UTC = 09:07 hora española (verano) / 08:07 (invierno)
    # Nota: se usa un minuto "raro" (no :00) porque GitHub retrasa/omite las tareas
    # programadas a las en punto cuando hay mucha carga. Aun así pueden llegar con
    # algo de retraso; no está garantizado al minuto exacto.
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      ignore_seen:
        description: "Reenviar todo lo de la ventana (ignora la memoria; útil para ver el formato). No la modifica."
        type: boolean
        default: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Instalar paquetes R
        run: |
          Rscript -e 'install.packages(c("jsonlite","yaml","glue","blastula"), repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")'

      - name: Ejecutar alerta
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          IGNORE_SEEN: ${{ inputs.ignore_seen == true && '1' || '0' }}
        run: Rscript R/run.R

      - name: Guardar estado (artículos ya enviados)
        run: |
          git config user.name "alerta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git commit -m "Actualiza estado $(date -u +%F)" || echo "sin cambios"
          git push
